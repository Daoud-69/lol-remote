appId: com.lolremote.agent
productName: LoL Remote Agent
directories:
  buildResources: build
  output: build/dist
files:
  - out/**/*
  - "!**/*.map"
extraResources:
  - from: ../web/dist
    to: web-dist
  # The tray builds its icon from a file at runtime, so the icon has to exist
  # inside the installed app — `files` only packages out/, and win.icon below
  # only stamps the executable. Without this the tray icon is silently blank.
  - from: build/icon.ico
    to: icon.ico
win:
  target: nsis
  icon: build/icon.ico
  # No version in the filename, so that
  # releases/latest/download/LoLRemoteAgent-Setup.exe keeps working across
  # releases — a download button in the README should not need editing every
  # time a version ships. The version is still in the installer's own metadata.
  artifactName: LoLRemoteAgent-Setup.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LoL Remote Agent
  include: build/installer.nsh
