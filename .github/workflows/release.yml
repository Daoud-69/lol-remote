# Builds both halves and attaches them to a GitHub release.
#
# Push a v* tag and this produces the two files the README's download buttons
# link to. Doing it here rather than by hand is what stops a release drifting
# from the code it claims to be: the artifacts are built from the tag itself.
#
# Asset names deliberately carry no version, so
# releases/latest/download/<name> keeps resolving across releases.
name: Release

on:
  push:
    tags:
      - "v*"
  # Handy for testing the build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-agent:
    name: Windows agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package:installer builds web/ first and bundles it as a resource, so
      # the phone UI inside the installer always matches this commit.
      - name: Install dependencies
        run: |
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Build installer
        run: npm --prefix desktop run package:installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-agent
          path: desktop/build/dist/LoLRemoteAgent-Setup.exe
          if-no-files-found: error

  android-app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web bundle
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Sync the native project
        run: npx cap sync android
        working-directory: web

      - name: Assemble APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: web/android

      - name: Name it for release
        run: cp app/build/outputs/apk/debug/app-debug.apk LoLRemote.apk
        working-directory: web/android

      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: web/android/LoLRemote.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows-agent, android-app]
    runs-on: ubuntu-latest
    # workflow_dispatch runs have no tag to attach to, so they build only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifacts
          # Create the release if the tag has none yet, otherwise just add to it.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "LoL Remote $TAG" --generate-notes
          gh release upload "$TAG" \
            artifacts/LoLRemoteAgent-Setup.exe \
            artifacts/LoLRemote.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
